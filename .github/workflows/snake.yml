name: Generate Snake

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: abhimani-io
          outputs: |
            dist/snake.svg

      - name: Push snake
        uses: EndBug/add-and-commit@v9
        with:
          add: "dist/snake.svg"
          message: "Generate contribution snake"
          push: true
